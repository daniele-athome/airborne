name: android

on:
  push:
    paths-ignore:
      - README.md
      - 'docs/**'
      - 'server/**'
      - 'utils/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/server.yml'
      - '.github/workflows/screenshots.yml'
  pull_request:
    paths-ignore:
      - README.md
      - 'docs/**'
      - 'server/**'
      - 'utils/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/server.yml'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

env:
  flutter_version: '3.47.6'

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 21

      - name: Calculating hash of patches for the cache keys
        id: patches-hash
        run: |
          patches=./.github/workflows/patches
          echo "FLUTTER_PATCHES_HASH=$(find $patches/flutter -type f -print0 | sort -zV | xargs -0 sha1sum | sha1sum | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "DEPS_PATCHES_HASH=$(find $patches -type f -not -path "$patches/flutter/*" -print0 | sort -zV | xargs -0 sha1sum | sha1sum | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          flutter-version: ${{ env.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ steps.patches-hash.outputs.FLUTTER_PATCHES_HASH }}"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}-${{ steps.patches-hash.outputs.DEPS_PATCHES_HASH }}"

      - name: Patch Flutter
        if: steps.flutter-action.outputs.CACHE-HIT != 'true'
        run: ./.github/workflows/patch-flutter.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Patch dependencies
        run: ./.github/workflows/patch-deps.sh

      - name: Check code formatting
        run: dart format --set-exit-if-changed .

      - name: Building generated source code
        run: dart run build_runner build

      - name: Analyze code
        run: flutter analyze --no-pub .

      - name: Run tests
        run: flutter test --no-pub -r github test

      - name: Run integration tests
        # does not work yet
        if: false
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: '35'
          arch: x86_64
          profile: 'pixel_5'
          avd-name: 'Pixel_5'
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics'
          script: |
            flutter config --android-sdk /usr/local/lib/android/sdk
            flutter doctor
            flutter devices
            ./.github/workflows/integration-tests.sh emulator-5554

      - name: Build Android application (debug)
        if: github.ref_name != 'release'
        run: flutter build appbundle --no-pub --debug

      - name: Prepare for release build
        if: github.ref_name == 'release'
        env:
          ENCRYPTED_FILE_KEY: ${{ secrets.ENCRYPTED_FILE_KEY }}
          ENCRYPTED_FILE_IV: ${{ secrets.ENCRYPTED_FILE_IV }}
        run: |
          cd android
          openssl aes-256-cbc -K $ENCRYPTED_FILE_KEY -iv $ENCRYPTED_FILE_IV -in fastlane/androidkey.jks.enc -out fastlane/androidkey.jks -d

      - name: Build Android application (release)
        if: github.ref_name == 'release'
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # the first "flutter build apk" command would not be needed, however:
        # https://github.com/flutter/flutter/issues/169336#issuecomment-2981193835
        run: |
          flutter build apk --config-only --release
          flutter build appbundle --no-pub --release

      - name: Upload release artifact for deploy
        if: github.ref_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: android-bundle-release
          path: build/app/outputs/bundle/release/app-release.aab

  deploy:
    needs: test-build
    if: github.ref_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download deploy artifact
        uses: actions/download-artifact@v8
        with:
          name: android-bundle-release
          path: build/app/outputs/bundle/release

      - name: Prepare for deploy
        env:
          ENCRYPTED_FILE_KEY: ${{ secrets.ENCRYPTED_FILE_KEY }}
          ENCRYPTED_FILE_IV: ${{ secrets.ENCRYPTED_FILE_IV }}
        run: |
          cd android
          openssl aes-256-cbc -K $ENCRYPTED_FILE_KEY -iv $ENCRYPTED_FILE_IV -in fastlane/googleplay-developer-key.json.enc -out fastlane/googleplay-developer-key.json -d

      - name: Setup Ruby environment
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'

      - name: Install Fastlane
        run: |
          gem install fastlane -N
          # https://github.com/fastlane/fastlane/issues/29183#issuecomment-2567093826
          gem install abbrev mutex_m ostruct -N

      - name: Deploy to Google Play
        run: |
          cd android
          fastlane deploy_production
