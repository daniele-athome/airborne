name: linux

on:
  push:
    paths-ignore:
      - README.md
      - 'docs/**'
      - 'server/**'
      - 'utils/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/server.yml'
      - '.github/workflows/screenshots.yml'
  pull_request:
    paths-ignore:
      - README.md
      - 'docs/**'
      - 'server/**'
      - 'utils/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/server.yml'
      - '.github/workflows/screenshots.yml'
  workflow_dispatch:

env:
  flutter_version: '3.47.6'

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculating hash of patches for the cache keys
        id: patches-hash
        run: |
          patches=./.github/workflows/patches
          echo "FLUTTER_PATCHES_HASH=$(find $patches/flutter -type f -print0 | sort -zV | xargs -0 sha1sum | sha1sum | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "DEPS_PATCHES_HASH=$(find $patches -type f -not -path "$patches/flutter/*" -print0 | sort -zV | xargs -0 sha1sum | sha1sum | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          flutter-version: ${{ env.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ steps.patches-hash.outputs.FLUTTER_PATCHES_HASH }}"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}-${{ steps.patches-hash.outputs.DEPS_PATCHES_HASH }}"

      - name: Patch Flutter
        if: steps.flutter-action.outputs.CACHE-HIT != 'true'
        run: ./.github/workflows/patch-flutter.sh

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install clang lld cmake ninja-build pkg-config libgtk-3-dev

      - name: Configure Flutter for Linux
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Patch dependencies
        run: ./.github/workflows/patch-deps.sh

      - name: Check code formatting
        run: dart format --set-exit-if-changed .

      - name: Building generated source code
        run: dart run build_runner build

      - name: Analyze code
        run: flutter analyze --no-pub .

      - name: Run tests
        run: flutter test --no-pub -r github test

      - name: Run integration tests
        run: xvfb-run ./.github/workflows/integration-tests.sh linux

      - name: Build Linux application (debug)
        run: flutter build linux --no-pub --debug

      - name: Archive debug build
        if: github.ref_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle-debug
          path: build/linux/x64/debug/bundle/

      - name: Build Linux application (release)
        run: flutter build linux --no-pub --release

      - name: Archive release build
        if: github.ref_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle-release
          path: build/linux/x64/release/bundle/
