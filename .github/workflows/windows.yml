name: windows

on:
  push:
    paths-ignore:
      - README.md
      - 'docs/**'
      - 'server/**'
      - 'utils/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/server.yml'
  pull_request:
    paths-ignore:
      - README.md
      - 'docs/**'
      - 'server/**'
      - 'utils/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/server.yml'
  workflow_dispatch:

env:
  flutter_version: '3.47.6'

jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Calculating hash of patches for the cache keys
        id: patches-hash
        shell: bash
        run: |
          patches=./.github/workflows/patches
          echo "FLUTTER_PATCHES_HASH=$(find $patches/flutter -type f -print0 | sort -zV | xargs -0 sha1sum | sha1sum | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "DEPS_PATCHES_HASH=$(find $patches -type f -not -path "$patches/flutter/*" -print0 | sort -zV | xargs -0 sha1sum | sha1sum | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Setup Flutter environment
        uses: subosito/flutter-action@v2
        id: flutter-action
        with:
          flutter-version: ${{ env.flutter_version }}
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ steps.patches-hash.outputs.FLUTTER_PATCHES_HASH }}"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('pubspec.lock') }}-${{ steps.patches-hash.outputs.DEPS_PATCHES_HASH }}"

      - name: Patch Flutter
        if: steps.flutter-action.outputs.CACHE-HIT != 'true'
        shell: bash
        run: ./.github/workflows/patch-flutter.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Patch dependencies
        shell: bash
        run: ./.github/workflows/patch-deps.sh

      - name: Check code formatting
        run: dart format --set-exit-if-changed .

      - name: Building generated source code
        run: dart run build_runner build

      - name: Analyze code
        run: flutter analyze --no-pub .

      - name: Run tests
        run: flutter test --no-pub -r github test

      - name: Run integration tests
        shell: bash
        run: ./.github/workflows/integration-tests.sh windows

      - name: Configure Flutter for Windows
        run: flutter config --enable-windows-desktop

      - name: Build Windows application (debug)
        run: flutter build windows --no-pub --debug

      - name: Archive debug build
        if: github.ref_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle-debug
          path: build/windows/x64/runner/debug/

      - name: Build Windows application (release)
        run: flutter build windows --no-pub --release

      - name: Archive release build
        if: github.ref_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle-release
          path: build/windows/x64/runner/release/
